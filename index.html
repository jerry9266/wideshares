<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Ready to Download | WIDESHARES</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header with Back Arrow */
        .header {
            width: 100%;
            height: 60px;
            background-color: #000000;
            border-bottom: 1px solid #161a24;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 19px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background-color: #131722;
        }

        .header-title {
            margin-left: 12px;
            font-size: 17px;
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Main Center Container */
        .main-container {
            max-width: 580px;
            width: 100%;
            margin: 35px auto;
            padding: 0 20px;
            flex-grow: 1;
        }

        /* Dark Slate-Navy Card Surface (#131722) */
        .download-card {
            background-color: #131722;
            border: 1px solid #1f2536;
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-heading {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        /* Inner File Box (#0e1119) */
        .file-box {
            background-color: #0e1119;
            border: 1px solid #1f2430;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 22px;
        }

        .file-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.45;
            word-break: break-word;
            margin-bottom: 12px;
        }

        .file-meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        /* Orange Badge Tag */
        .badge-mkv {
            background-color: #2b1a15;
            color: #ff5722;
            border: 1px solid #4a261c;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .file-meta-text {
            color: #727d92;
            font-weight: 500;
        }

        .meta-dot {
            color: #434c5e;
            margin: 0 2px;
        }

        /* Vibrant Orange Download Button (#f25522) */
        .download-btn {
            background: linear-gradient(180deg, #ff5722 0%, #ee4713 100%);
            background-color: #f25522;
            color: #ffffff;
            border: none;
            width: 100%;
            height: 54px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 18px rgba(242, 85, 34, 0.4);
            transition: transform 0.1s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        .download-btn:hover {
            filter: brightness(1.08);
            box-shadow: 0 6px 24px rgba(242, 85, 34, 0.55);
        }

        .download-btn:active {
            transform: scale(0.985);
            box-shadow: 0 2px 10px rgba(242, 85, 34, 0.3);
        }

        .download-btn i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Header with Back Arrow -->
    <header class="header">
        <button type="button" class="back-btn" onclick="goBack()" aria-label="Go Back">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <span class="header-title">Ready to Download</span>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">
        
        <div class="download-card">
            
            <div class="card-header-row">
                <span class="card-heading">Ready to Download</span>
            </div>

            <!-- File Details Box -->
            <div class="file-box">
                <div class="file-name" id="display-filename">
                    Loading file details...
                </div>
                <div class="file-meta-row">
                    <span class="badge-mkv" id="display-type">MKV / HD</span>
                    <span class="file-meta-text">
                        <span id="display-filesize">--</span>
                        <span class="meta-dot">•</span>
                        <span>Direct High-Speed</span>
                    </span>
                </div>
            </div>

            <!-- Download Button executing strict dynamic Wideshares request -->
            <button type="button" id="start-dl-btn" onclick="startDownload()" class="download-btn">
                <i class="fa-solid fa-cloud-arrow-down"></i>
                <span>DOWNLOAD</span>
            </button>

        </div>

    </main>

    <!-- Dynamic Wideshares Pathname-based ID Extractor -->
    <script>
        const BASE_HOST = "https://wideshares.org";

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "about:blank";
            }
        }

        function resolveFileId() {
            // 1. Primary source: Extract {VIDEO_ID} directly from /download/{VIDEO_ID} in the pathname
            const pathMatch = window.location.pathname.match(/(?:\/download)?\/([a-zA-Z0-9_-]+)/i);
            let rawId = (pathMatch && pathMatch[1]) ? pathMatch[1] : '';

            // 2. Fallback check for query parameters if passed
            if (!rawId) {
                const params = new URLSearchParams(window.location.search);
                rawId = (params.get('id') || '').trim();
            }

            if (!rawId) return '';

            const cleanId = rawId.split(/[?#]/)[0].replace(/^\/+|\/+$/g, '');

            // Guard against admin/login/system filenames
            if (/admin|login/i.test(cleanId)) {
                return '';
            }

            return cleanId;
        }

        function getDownloadUrl() {
            const videoId = resolveFileId();
            if (!videoId) return '';

            return BASE_HOST + "/download/" + encodeURIComponent(videoId);
        }

        function startDownload() {
            const targetDownloadUrl = getDownloadUrl();

            if (!targetDownloadUrl) {
                alert("Invalid or missing WIDESHARES video ID.");
                return;
            }

            // Direct navigation to https://wideshares.org/download/{VIDEO_ID}
            window.location.href = targetDownloadUrl;
        }

        // Populate dynamic metadata from query parameters if present
        (function() {
            const params = new URLSearchParams(window.location.search);

            if (params.has('name')) {
                const name = params.get('name');
                document.getElementById('display-filename').innerText = name;
                document.getElementById('page-title').innerText = name + " | WIDESHARES";
            }
            if (params.has('size')) {
                document.getElementById('display-filesize').innerText = params.get('size');
            }
            if (params.has('type')) {
                document.getElementById('display-type').innerText = params.get('type');
            }
        })();
    </script>
</body>
</html>
